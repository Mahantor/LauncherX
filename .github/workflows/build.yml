name: Build LauncherX for Windows 11 x64

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      - name: Restore NuGet packages
        run: dotnet restore LauncherX.sln

      # Build with the XAML compiler stderr piped to a file for debugging
      - name: Build LauncherX (x64 Release) with XAML debug
        shell: pwsh
        run: |
          dotnet build LauncherX.sln -c Release -p:Platform=x64 --no-restore -v:d 2>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== Checking output.json for XAML compiler errors ==="
            $jsonPath = "LauncherXWinUI\obj\x64\Release\net8.0-windows10.0.22621.0\win-x64\output.json"
            if (Test-Path $jsonPath) {
              Get-Content $jsonPath -Raw | Write-Host
            }
            # Also check if input.json exists to see what was passed
            $inputPath = "LauncherXWinUI\obj\x64\Release\net8.0-windows10.0.22621.0\win-x64\input.json"
            if (Test-Path $inputPath) {
              Get-Content $inputPath -Raw | Out-File -FilePath input.json -Encoding utf8
              Write-Host "=== input.json saved for inspection ==="
            }
            exit 1
          }

      - name: Publish LauncherX (self-contained x64)
        if: success()
        run: dotnet publish LauncherXWinUI/LauncherXWinUI.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:WindowsPackageType=None -p:PublishSingleFile=false -p:PublishTrimmed=true -p:PublishReadyToRun=true --self-contained true --output publish/x64 --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LauncherX-Windows11-x64
          path: publish/x64/
          compression-level: 6
          if-no-files-found: error
